<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отчеты Эквайринга — демо</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MarieSmi/ui-kit@1.20.1/tokens.css">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MarieSmi/ui-kit@1.20.1/components/demo-frame/demo-frame.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MarieSmi/ui-kit@1.20.1/components/switch/switch.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--background-default_background-color, #fff);
    font-family: var(--font-font-family-default), sans-serif;
    color: var(--text-text-color);
  }
  .stage {
    position: absolute; left: 0; top: 0; width: 1024px; height: 768px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--border-pale_border-color);
    background: #e9eaee; /* нет токена: подложка сцены, компонент показан отдельно */
  }

  /* Тулбар справа (Тулбар Saby Trade) — в ui-kit нет, по макету */
  .side-toolbar { flex: none; width: 52px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 6px 0; }
  .side-toolbar__bottom { display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .round {
    box-sizing: border-box; width: 32px; height: 32px; border-radius: 16px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: var(--background-contrast-pale_color);
    border: 1px solid var(--border-pale_border-color); color: var(--icon-icon-color); font-family: "cbuc-icons"; font-size: 16px;
  }
  .round--date { font-family: var(--font-font-family-default); line-height: 10px; }
  .round--date b { font-size: 14px; font-weight: 400; }
  .round--date small { font-size: 12px; }
  .round--help { background: var(--background-info_hover_background-color); border-color: #e1dbff; /* нет токена */
    color: var(--icon-info_icon-color); font-family: var(--icon-font-family-m_icon_font-family); font-size: 24px; }

  /* ===== Страница «Эквайринг» (Первый вход) — окружение компонента ===== */
  .page { position: absolute; inset: 0; display: flex; background: var(--background-unaccented_background-color); }
  .acc { width: 200px; flex: none; background: #2e3c4e; /* нет токена: фон аккордеона Saby */ }
  .acc img { display: block; width: 200px; height: 768px; } /* аккордеон — картинкой из макета */
  .pg { flex: 1 1 0; position: relative; }
  /* Вкладки (tabs/gorizontal, Figma): 15px, активная Semi Bold primary + маркер 3px r4 под текстом; ширина под жирный текст */
  .pg__tabs { position: absolute; right: 64px; top: 46px; display: flex; gap: 25px; font-size: var(--font-font-size-font-size_l); letter-spacing: -0.2115px; color: var(--text-secondary_text-color); }
  .pg__tabs span { display: inline-grid; padding-top: 7px; height: 32px; box-sizing: border-box; cursor: pointer; }
  .pg__tabs span::before { content: attr(data-t); font-weight: 600; visibility: hidden; height: 0; overflow: hidden; }
  .pg__tabs span::after { content: ""; height: 3px; margin-top: 4px; border-radius: 4px; background: var(--extra-marker_color); opacity: 0; }
  .pg__tabs span.is-active { font-weight: 600; color: var(--text-primary_text-color); }
  .pg__tabs span.is-active::after { opacity: 1; }
  /* Тулбар справа (Figma «тулбар» 52×768): «КВ» с точкой-уведомлением, информеры внизу */
  .pg__user { position: absolute; right: 16px; top: 13px; font-size: 14px; font-weight: 600; color: var(--text-label_text-color); }
  .pg__user::after { content: ""; position: absolute; left: -1px; top: 12px; width: 6px; height: 6px; border-radius: 50%;
    background: #f47843; /* нет токена: точка уведомления из макета */ box-shadow: 0 0 0 1px var(--background-unaccented_background-color); }
  .pg__tb { position: absolute; right: 10px; bottom: 6px; }
  .pg__body { position: absolute; left: 64px; top: 178px; width: 644px; }
  .pg__title { margin: 0 0 20px; line-height: 31px; font-size: 24px; font-weight: 400; color: var(--text-label_text-color); letter-spacing: -0.34px; }
  .chips { display: flex; gap: 8px; margin-bottom: 24px; }
  .chip { all: unset; cursor: pointer; height: 32px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px;
    background: var(--background-background-color); border-radius: 16px; font-size: 15px; box-shadow: 0 0 0 1px var(--border-pale_border-color); }
  .chip img { width: 24px; height: 24px; }
  .chip--more { width: 32px; padding: 0; justify-content: center; font-family: var(--icon-font-family-m_icon_font-family); font-size: 24px; color: #333; /* макет */ }
  .chip:hover { background: var(--background-hover_background-color); }
  .chip--static { cursor: default; } .chip--static:hover { background: var(--background-background-color); }
  .pg__cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pg__cols .caption { padding: 0 0 12px; font-size: 18px; line-height: 22px; letter-spacing: -0.25px; color: var(--components-list-placeholder_text-color_list); }
  .pg__cols .menu-card { height: 290px; box-sizing: border-box; border-radius: 20px; padding-top: 11px; gap: 7px; }
  .pg__cols .menu-item__desc { white-space: normal; }

  /* ===== Представления страницы (Figma: разделы «Пустое», «Типовое», «Максимальное»), 1024×768 ===== */
  .vw { flex: 1 1 0; display: flex; min-width: 0; background: var(--background-unaccented_background-color); }
  .vw__main { width: 772px; flex: none; display: flex; flex-direction: column; }
  .vw__head { height: 46px; display: flex; align-items: center; gap: 12px; padding-left: var(--offset-offset_m); }
  .vw__head > :first-child { flex: 1 1 0; }
  .add-btn { all: unset; cursor: pointer; width: 40px; height: 26px; border-radius: 100px; background: var(--extra-brand_color);
    color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: "cbuc-icons"; font-size: 16px; }
  .vw-search { margin-right: -8px; /* Figma: поиск вплотную к фильтру (4px) */  width: 300px; height: 26px; box-sizing: border-box; border: 1px solid var(--border-border-color); border-radius: 14px;
    background: var(--background-background-color); display: flex; align-items: center; padding-left: var(--offset-offset_m); font-size: 14px; }
  .vw-search span { flex: 1 1 0; color: var(--components-input-placeholder-color_inputtext); }
  .vw-search b { height: 26px; margin: -1px -1px -1px 0; padding: 0 8px; border-radius: 100px; display: inline-flex; align-items: center; gap: 4px;
    background: var(--background-same-secondary_same_background-color); font-weight: 400; color: var(--text-text-color); }
  .vw-search b i { font-style: normal; font-family: "cbuc-icons"; font-size: 12px; color: var(--icon-label_icon-color); }
  .vw-filter { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-family: "cbuc-icons24"; font-size: 24px; color: var(--icon-secondary_icon-color); }
  .vw__tabs { height: 32px; display: flex; justify-content: flex-end; }
  .vw__tab { padding: 0 12px; height: 32px; box-sizing: border-box; padding-top: 3px; display: flex; flex-direction: column; justify-content: center;
    font-size: var(--font-font-size-font-size_l); color: var(--text-secondary_text-color); cursor: pointer; }
  .vw__tab.is-active { font-weight: 600; color: var(--text-primary_text-color); }
  .vw__tab.is-active span { box-shadow: 0 9px 0 -6px var(--extra-marker_color); }
  .vw__body { flex: 1 1 0; min-height: 0; display: flex; }
  .vw__master { width: 350px; flex: none; box-sizing: border-box; padding: 0 4px 24px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .vw__reg { flex: 1 1 0; min-width: 0; padding-left: 4px; display: flex; flex-direction: column; gap: 8px; }
  .vw-tb { width: 52px; flex: none; display: flex; flex-direction: column; align-items: center; padding: 12px 0 6px; box-sizing: border-box; }
  .vw-tb__user { font-size: 14px; font-weight: 600; color: var(--text-label_contrast_text-color); height: 20px; }
  .vw-tb__ic { width: 32px; height: 32px; margin-top: 6px; display: flex; align-items: center; justify-content: center;
    font-family: "cbuc-icons24"; font-size: 24px; color: var(--icon-secondary_icon-color); }
  .vw-tb__ic:first-of-type { margin-top: 14px; }
  .vw-tb .side-toolbar__bottom { margin-top: auto; }
  /* Карточка договора в мастере */
  .dcard { background: var(--background-background-color); border-radius: var(--border-radius-border-radius_m, 12px); box-sizing: border-box; }
  .dcard--head { height: 88px; padding: 11px 12px 18px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .dcard__row { display: flex; align-items: center; gap: 12px; height: 24px; }
  .dcard__name { flex: 1 1 0; display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 600; letter-spacing: -0.25px; }
  .dcard__name img { width: 24px; height: 24px; }
  .dcard__ok { font-style: normal; font-family: "cbuc-icons"; font-size: 12px; color: var(--icon-success_icon-color, #298e3c); padding-top: 4px; }
  .dcard__lbl { font-size: 14px; color: var(--text-label_text-color); padding-top: 2px; }
  .dcard__cnt { display: flex; justify-content: space-between; align-items: center; height: 29px; }
  .dcard__fee { display: flex; align-items: center; gap: 4px; padding-top: 7px; font-size: 13px; color: var(--text-unaccented_text-color); }
  .dcard__fee i { font-style: normal; font-family: "cbuc-icons"; font-size: 14px; color: var(--icon-unaccented_icon-color, #ccc); }
  .dcard__sum { display: flex; align-items: baseline; gap: 10px; font-size: 28px; font-weight: 600; letter-spacing: -0.39px; }
  .dcard__sum small { font-size: 14px; font-weight: 400; color: var(--text-label_text-color); letter-spacing: 0; }
  .dcard--list { padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .dcard--pts { padding-left: 16px; } .dcard--pts .dcard__title { margin-bottom: 4px; } /* Figma «1 договор»: список точек */
  .dcard__title { display: flex; align-items: center; gap: 12px; font-size: 16px; }
  .dcard__plus { all: unset; cursor: pointer; height: 24px; padding: 0 10px; border-radius: 100px; background: var(--background-contrast-pale_color);
    font-family: "cbuc-icons"; font-size: 16px; display: inline-flex; align-items: center; }
  .dcard__hint { font-size: 14px; color: var(--components-list-placeholder_text-color_list); }
  .dcard__item { font-size: 14px; line-height: 30px; }
  .dcard__item small { font-size: 14px; color: var(--text-label_text-color); margin-left: 6px; }
  /* Виджет «Динамика оплат» */
  .dyn { position: relative; background: #fff; border-radius: 8px; box-shadow: 0 0 4px rgba(0,0,0,.06); /* тень shadow_c из макета */
    height: 252px; flex: none; padding: 13px 12px 12px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; }
  .dyn::before { content: ""; position: absolute; left: 0; top: 12px; width: 4px; height: 22px; border-radius: 0 2px 2px 0; background: var(--extra-brand_color); }
  .dyn__title { margin: 0; height: 22px; font-size: 18px; font-weight: 600; letter-spacing: -0.25px; }
  .dyn__in { flex: 1 1 0; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .dyn__empty { font-size: 14px; color: var(--components-list-placeholder_text-color_list); }
  .chart { flex: 1 1 0; display: flex; gap: 12px; min-height: 0; }
  .chart__y { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .chart__unit { font-size: 10px; font-weight: 600; color: var(--text-secondary_text-color); text-transform: uppercase; }
  .chart__ticks { flex: 1 1 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; padding-bottom: 15px;
    font-size: 12px; color: var(--text-label_text-color); }
  .chart__plot { flex: 1 1 0; position: relative; min-width: 0; }
  .chart__grid { position: absolute; inset: 0; padding-top: 20px; padding-bottom: 0; display: flex; flex-direction: column; justify-content: space-between; }
  .chart__grid > i { display: flex; align-items: center; height: 15px; } .chart__grid > i::before { content: ""; flex: 1; height: 1px; background: var(--border-border-color); }
  .chart__x { border-top: 1px solid var(--border-unaccented_border-color, #d2d6da); display: flex; }
  .chart__x span { position: relative; flex: 1 1 0; padding-top: 7px; text-align: center; font-size: 12px; color: var(--text-label_text-color); }
  .chart__x span::before { content: ""; position: absolute; left: 0; top: 0; width: 1px; height: 4px; background: var(--border-unaccented_border-color, #d2d6da); }
  .chart__x span:last-child::after { content: ""; position: absolute; right: 0; top: 0; width: 1px; height: 4px; background: var(--border-unaccented_border-color, #d2d6da); }
  .chart__x span.is-off { color: var(--text-danger_text-color); }
  .chart__graph { position: absolute; left: 0; right: 0; top: 28px; bottom: 23px; }
  .chart__graph img { display: block; width: 100%; height: 100%; }
  /* Реестр */
  .reg { flex: 1 1 0; min-height: 0; background: #fff; border-radius: 8px 8px 0 0; box-shadow: 0 0 8px rgba(0,0,0,.06); overflow: hidden; }
  .reg--empty { padding: 32px 12px 20px 32px; }
  .stub { padding: 16px 20px; border-radius: 16px; display: flex; flex-direction: column; gap: 8px;
    background: radial-gradient(ellipse 110% 100% at 0 20%, rgba(0,133,242,.07), rgba(0,133,242,0) 100%), #fff; /* градиент заглушки из макета */ }
  .stub__title { font-size: 16px; line-height: 19px; color: var(--text-label_text-color); padding-top: 2px; }
  .stub__text { font-size: 14px; line-height: 18px; color: var(--text-label_text-color); padding-top: 8px; }

  /* Типовое: счетчики, сравнение периодов, мастер «По компании», реестр оплат */
  .cnt { flex: none; height: 88px; box-sizing: border-box; background: #fff; border-radius: 8px; box-shadow: 0 0 4px rgba(0,0,0,.06);
    position: relative; overflow: hidden; display: flex; gap: 24px; padding: 0 12px; }
  .cnt--fit .cnt__item { min-width: 124px; } /* Figma «1 договор»: шаг счетчиков 148 */
  .cnt__item { flex: none; padding-top: 16px; white-space: nowrap; }
  .cnt__lbl { font-size: 14px; color: var(--text-label_text-color); height: 17px; }
  .cnt__val { margin-top: 8px; display: flex; align-items: center; gap: 4px; font-size: 24px; letter-spacing: -0.34px; }
  .cnt__val i { font-style: normal; font-family: "cbuc-icons24"; font-size: 24px; color: var(--icon-unaccented_icon-color, #ccc); }
  .cnt__val i.up { color: var(--icon-success_icon-color, #298e3c); } .cnt__val i.down { color: var(--icon-danger_icon-color, #c2140a); }
  .cnt__val small { font-size: 18px; color: var(--text-unaccented_text-color); letter-spacing: 0; }
  .cnt__more { position: absolute; right: 4px; top: 26px; width: 20px; height: 36px; border-radius: 10px; background: var(--background-contrast-pale_color);
    display: flex; align-items: center; justify-content: center; }
  .cnt__more::before { content: ""; width: 6px; height: 6px; border: solid var(--icon-secondary_icon-color); border-width: 1.5px 1.5px 0 0; transform: rotate(45deg); margin-left: -3px; }
  .cnt::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 40px; background: linear-gradient(90deg, rgba(255,255,255,0), #fff 60%); pointer-events: none; }
  .cnt--fit::after { display: none; }
  .dyn--data { height: 250px; padding: 12px; gap: 12px; }
  .dyn--data::before { top: 12px; }
  .cmp { height: 78px; margin-bottom: -28px; display: flex; justify-content: center; gap: 24px; flex: none; }
  .cmp__nav { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .cmp__arrows { display: flex; gap: 6px; }
  .cmp__arrows span { width: 24px; height: 24px; border-radius: 100px; display: flex; align-items: center; justify-content: center; }
  .cmp__arrows span:first-child { background: var(--background-contrast-pale_color); }
  .cmp__arrows span::before { content: ""; width: 6px; height: 6px; border: solid var(--icon-label_icon-color); border-width: 0 0 1.5px 1.5px; transform: rotate(45deg); margin-left: 3px; }
  .cmp__arrows span + span::before { transform: rotate(-135deg); margin: 0 3px 0 0; }
  .cmp__per { height: 24px; display: flex; align-items: flex-end; font-size: 10px; text-transform: uppercase; color: var(--text-label_text-color); }
  .cmp__vals { display: flex; align-items: flex-start; padding-top: 1px; }
  .cmp__col { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .cmp__seg { height: 24px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: var(--text-label_text-color); }
  .cmp__seg::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: #dfe6eb; /* graphs__baseColors_color-0 */ }
  .cmp__seg--cur { color: var(--text-link_text-color); } .cmp__seg--cur::before { background: #5c94fb; /* graphs__baseColors_color-1 */ }
  .cmp__num { height: 24px; display: flex; align-items: flex-end; font-size: 20px; letter-spacing: -0.28px; color: var(--text-label_text-color); }
  .cmp__num--cur { font-weight: 600; color: var(--text-text-color); }
  .cmp__swap { height: 24px; padding: 0 12px; display: flex; align-items: center; font-family: "cbuc-icons"; font-size: 16px; color: var(--icon-secondary_icon-color); }
  .cmp__cur { display: flex; gap: 4px; align-items: flex-start; }
  .cmp__delta { padding-top: 37px; font-size: 12px; color: var(--text-success_text-color, #298e3c); }
  .chart--data { flex: none; height: 129px; }
  .chart--data .chart__ticks span:first-child { font-size: 14px; font-weight: 600; color: var(--text-secondary_text-color); }
  .chart--data .chart__grid > i:first-child { height: 17px; }
  .chart--data .chart__graph { top: 20px; }
  .rg { flex: 1 1 0; min-height: 0; background: #fff; border-radius: 8px 8px 0 0; box-shadow: 0 0 8px rgba(0,0,0,.06); overflow: hidden; padding: 5px 0 0; }
  .rg__day { height: 32px; display: flex; align-items: flex-end; padding: 0 20px 6px; box-sizing: border-box; font-size: 15px; }
  .rg__row { height: 31px; display: flex; align-items: center; padding: 0 12px 0 0; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .rg__row:hover { background: var(--background-hover_background-color); }
  .rg__t { width: 56px; flex: none; text-align: right; font-size: 12px; color: var(--text-label_text-color); }
  .rg__ic { width: 16px; flex: none; margin: 0 16px 0 12px; font-family: "cbuc-icons"; font-size: 16px; color: var(--icon-unaccented_icon-color, #ccc); }
  .rg__t + .rg__name { margin-left: 16px; font-size: 14px; max-width: none; }
  .rg__name { flex: none; max-width: 120px; overflow: hidden; text-overflow: ellipsis; font-size: 15px; font-weight: 600; color: var(--text-secondary_text-color); margin-right: 6px; }
  .rg__name.is-none { color: var(--text-unaccented_text-color); }
  .rg__name--s { font-size: 14px; }
  .rg__cm { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--text-unaccented_text-color); }
  .rg__cm b { font-weight: 400; color: var(--text-label_text-color); }
  .rg__bank { flex: none; margin: 0 10px 0 8px; font-size: 12px; color: var(--text-label_text-color); }
  .rg__sum { flex: none; width: 70px; text-align: right; font-size: 15px; font-weight: 600; color: var(--text-secondary_text-color); }
  .rg__sum.is-neg { color: var(--text-danger_text-color); }
  .rg__sum small { font-size: 12px; font-weight: 400; color: #ccc; /* unaccented, копейки */ margin-left: 0; }
  .mst { padding: 0 0 0 0; }
  .mst__head { height: 36px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 12px 0 16px; font-size: 14px; color: var(--text-label_text-color); }
  .mst__head span { display: flex; align-items: center; gap: 4px; line-height: 16px; }
  .mst__head em { font-style: normal; }
  .mst__head i { font-style: normal; font-family: "cbuc-icons"; font-size: 14px; }
  .mst__row { display: flex; align-items: center; gap: 4px; height: 37px; padding: 0 12px 0 16px; font-size: 15px; cursor: pointer; }
  .mst__row:hover { background: var(--background-hover_background-color); }
  .mst__row img { width: 16px; height: 16px; }
  .mst__row--all { height: 41px; box-sizing: border-box; padding-bottom: 5px; background: var(--background-same-secondary_same_background-color); box-shadow: inset 3px 0 0 var(--extra-marker_color);
    font-size: 16px; font-weight: 600; text-transform: uppercase; }
  .mst__row--all .mst__sum { font-size: 28px; letter-spacing: -0.39px; }
  .mst__row--all .mst__name { position: relative; top: 5px; } /* по базовой линии суммы */
  .mst__row--l2 .mst__sum { font-size: 15px; }
  .mst__row--l2 { font-size: 14px; }
  .mst__name { flex: 0 1 auto; }
  .mst__chev { font-style: normal; font-family: "cbuc-icons"; font-size: 16px; color: var(--icon-label_icon-color); }
  .mst__type { margin-left: auto; width: 82px; display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-unaccented_text-color); }
  .mst__type i { font-style: normal; font-family: "cbuc-icons"; font-size: 14px; color: var(--icon-unaccented_icon-color, #ccc); }
  .mst__sum { margin-left: auto; text-align: right; }

  /* Таблица: колонки как в макете «Расчеты по эквайрингу» (Figma 33184:306168): На начало (1) · Обороты (2) · На конец (1) */
  .rt { padding-top: 9px; display: grid; grid-template-columns: 20px 461px 100px 109px 109px 101px; }

  .rt__sub--last { padding-right: 12px !important; }

    background: #f47843; /* нет токена: маркер активной строки */ }

  /* ===== План Б: «Журнал проверки» (стандарт «Проверка отчета») поверх отчета ===== */

    box-shadow: 0 4px 24px rgba(0,0,0,.16); /* нет токена */ font-size: 14px; line-height: 19px; color: #000; }

  /* журнал: высота по умолчанию 400 по стандарту, на экране 768 берем 330; «уменьшить высоту» — 200 */

  /* выполняется проверка: шаги маршрута как этапы проверки */

  const s = cjState(), list = chk.st === 'found';
  const order = ORDER(), n = order.length;
  const arrows = list && s.cnt ? `<span class="cj__arr cj__arr--prev${chk.sel <= 0 ? ' is-ro' : ''}" data-nav="-1" title="Предыдущая"></span><span class="cj__arr cj__arr--next${chk.sel >= n - 1 ? ' is-ro' : ''}" data-nav="1" title="Следующая"></span>` : '';
  if (!chk.open) {
    const cur = list && chk.sel >= 0 ? order[chk.sel] : null;
    return `<div class="cj-mini ${s.cls}" data-expand>${cur ? `${s.ic}<span class="cj-mini__txt">${cur.text.replace(/<[^>]+>/g, '')}</span>`
      : `${s.ic}<span class="cj__title">${s.title}</span>${s.cnt ? `<span class="cj__cnt">${s.cnt}</span>` : ''}`}${arrows}</div>`;
  }
  const date = chk.st === 'run' ? '' : `<span class="cj__date">25 ноя'26 15:30</span><span class="cj__re" title="Перепроверить" data-recheck>&#xE62C;</span>`;
  const body = chk.st === 'run' ? cjRun() : chk.st === 'ok' ? cjEmpty() : cjTree();
  return `<section class="cj ${s.cls}${chk.low ? ' is-low' : ''}" aria-label="Журнал проверки">
    <div class="cj__head">${s.ic}<span class="cj__title">${s.title}</span>${s.cnt ? `<span class="cj__cnt">${s.cnt}</span>` : ''}${date}<span class="cj__sp"></span>
      ${list ? '<span class="cj__hb cj__hb--f" title="Фильтр" data-toast="Фильтр: ошибки / предупреждения / скрытые">&#xE94C;</span>' : ''}${arrows}
      ${chk.st === 'run' ? '' : `<span class="cj__hb cj__hb--sz" title="${chk.low ? 'Увеличить' : 'Уменьшить'} высоту" data-low></span>`}
      <span class="cj__hb cj__hb--x" title="Свернуть" data-collapse>&#xE66C;</span></div>
    <div class="cj__body">${body}</div></section>`;
};
function runCheck() {
  clearInterval(runTimer);
  Object.assign(chk, { st: 'run', open: true, prog: 0, sel: -1 }); drawReport();
  runTimer = setInterval(() => { chk.prog++; if (chk.prog >= 6) { clearInterval(runTimer); chk.st = 'found'; } drawReport(); }, 700);
}
function selectIssue(i) {
  const order = ORDER(); if (i < 0 || i >= order.length) return;
  chk.sel = i; const x = order[i]; repActive = x.row ?? -1; drawReport();
  const r = repEl.querySelector(`.rt__row[data-row="${repActive}"] > div`);   // подскролл сущности в отчете
  if (r) { const b = repEl.querySelector('.rep__body'); b.scrollTop = Math.max(0, r.offsetTop - 120); }
  // прокручиваем только список журнала: scrollIntoView сдвигал всю панель отчета и рамку демо
  const list = repEl.querySelector('.cj__body'), cur = repEl.querySelector('.cj__rec.is-sel');
  if (list && cur) {
    const top = cur.offsetTop - list.offsetTop, bottom = top + cur.offsetHeight;
    if (top < list.scrollTop) list.scrollTop = top - 8;
    else if (bottom > list.scrollTop + list.clientHeight) list.scrollTop = bottom - list.clientHeight + 8;
  }
}

const reportPanel = () => `<div class="rep__main">
    <div class="rep__top${chk.st !== 'off' && BTN_VARS[BTN].near ? ' rep__top--near' : ''}"><h1 class="rep__title">Расчеты по эквайрингу</h1>
      ${chk.st !== 'off' ? `<button class="rep__check ${BTN_VARS[BTN].cls}" type="button" data-checkbtn title="Найти расхождения"><i class="rep__check-ic">${BTN_VARS[BTN].lupa ? SVG.check : '&#xEB21;'}</i><span class="rep__check-t">Найти расхождения</span></button>` : ''}
      <span class="rep__built">построен в 15:28<i title="Перестроить" data-toast="Отчет перестроен">&#xE62C;</i></span>
      <div class="rep__search">Найти</div></div>
    <div class="rep__filters"><span class="rep__funnel" title="Фильтр" data-toast="Окно «Фильтр» — пункт 4">&#xE94C;</span>
      <span class="rep__chip rep__chip--period" data-toast="Выбор периода — пункт 4">Ноябрь’26</span>
      <span class="rep__chip" data-toast="Окно «Фильтр» — пункт 4">Все юрлица</span></div>
    <div class="rep__body"${chk.st !== 'off' && chk.st !== 'start' && chk.open ? ` style="padding-bottom:${chk.low ? 200 : 330}px"` : ''}>${repTable()}</div>
    ${journal()}</div>
  <aside class="rep__tb"><div class="rep__close" title="Закрыть" data-close>&#xE66C;</div>
    ${TB.map(([ic, t, k]) => `<div class="rep__btn${k ? ' rep__btn--' + k : ''}" title="${t}" data-toast="«${t}» — в демо не входит">${ic}</div>`).join('')}
    <div class="side-toolbar__bottom"><div class="round" title="Заметки">&#xEA42;</div>${DATE}
      <div class="round" title="Звонки">&#xE636;</div><div class="round" title="Сообщения">&#xE65D;</div><div class="round round--help" title="Помощь">&#xE9C9;</div></div></aside>`;

/* ---------- Экраны ---------- */
const SCREENS = { 'оплаты': paymentsPage };
const REPORTS = { 'отчет_договоры': 'contracts', 'отчет_компании': 'companies' };
const repEl = document.getElementById('rep');
const drawReport = () => {   // перерисовка с сохранением прокрутки отчета и журнала
  const keep = ['.rep__body', '.cj__body'].map(s => repEl.querySelector(s)?.scrollTop || 0);
  repEl.innerHTML = reportPanel();
  ['.rep__body', '.cj__body'].forEach((s, i) => { const el = repEl.querySelector(s); if (el) el.scrollTop = keep[i]; });
};
// сценарии плана Б: [состояние журнала, доработка]
const CHECK_SCN = {
  'чек_старт':   () => ({ st: 'start' }),
  'чек_идет':    () => ({ st: 'run', prog: 4 }),
  'чек_ошибки':  () => ({ st: 'found' }),
  'чек_часть':   () => ({ st: 'found', done: new Set(['kom', 'dog']), ign: new Set(['wait']) }),
  'чек_свернут': () => ({ st: 'found', open: false, sel: 0 }),
  'чек_ок':      () => ({ st: 'ok' }),
};

const stage = document.getElementById('stage');
const pageEl = document.getElementById('page');
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('is-shown');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('is-shown'), 1800);
}
let frame;
function render(id) {
  if (BTN_VARS[id]) { BTN = id; id = 'чек_старт'; }
  pageEl.innerHTML = paymentsPage();
  clearInterval(runTimer);
  chk = Object.assign(CHK0(), CHECK_SCN[id] ? CHECK_SCN[id]() : {});
  const mode = REPORTS[id] || (CHECK_SCN[id] && 'contracts');
  repEl.hidden = !mode;
  if (mode) { repMode = mode; repActive = -1; drawReport(); if (chk.sel >= 0) selectIssue(chk.sel); }
}
stage.addEventListener('click', (e) => {
  const on = (a) => e.target.closest(`[${a}]`);
  let el;
  if ((el = on('data-fix'))) { toast(el.dataset.msg); chk.done.add(el.dataset.fix); drawReport(); return; }   // демо: после перехода считаем исправленным
  if ((el = on('data-ign'))) { const id = el.dataset.ign; chk.ign.has(id) ? chk.ign.delete(id) : chk.ign.add(id); drawReport(); return; }
  if ((el = on('data-toast'))) { toast(el.dataset.toast); return; }
  if (on('data-close')) { frame.select('оплаты'); return; }
  if (on('data-checkbtn')) { runCheck(); return; }
  if (on('data-run') || on('data-recheck')) { runCheck(); return; }
  if (on('data-showpart')) { clearInterval(runTimer); chk.st = 'found'; drawReport(); return; }
  if (on('data-collapse')) { chk.open = false; drawReport(); return; }
  if ((el = on('data-nav'))) { if (!el.classList.contains('is-ro')) selectIssue(chk.sel + +el.dataset.nav); return; }
  if (on('data-expand')) { chk.open = true; drawReport(); return; }
  if (on('data-low')) { chk.low = !chk.low; drawReport(); return; }
  if ((el = on('data-node'))) { const k = el.dataset.node; chk.closed.has(k) ? chk.closed.delete(k) : chk.closed.add(k); drawReport(); return; }
  if ((el = on('data-issue'))) { selectIssue(+el.dataset.issue); return; }
  const row = on('data-row'); if (row) { repActive = +row.dataset.row;   // клик по строке с ошибкой выбирает ее в журнале
    const i = chk.st === 'found' ? ORDER().findIndex(x => x.row === repActive) : -1; if (i >= 0) { selectIssue(i); return; } drawReport(); }
});

frame = DemoFrame.mount({
  stage,
  width: 1024, height: 768,
  devices: [{ id: 'laptop', icon: 'laptop', label: 'Ноутбук', size: '1024х768', name: 'ноутбук' }],
  scenarios: [
    { group: 'Расчеты по эквайрингу', items: [
      { id: 'отчет_договоры', title: 'По договорам' },
      { id: 'отчет_компании', title: 'Детализация: Наша компания' } ] },
    { group: 'План Б: журнал проверки', items: [
      { id: 'чек_старт', title: 'Типовое', variants: Object.entries(BTN_VARS).map(([id, v]) => ({ id, title: v.title })) },
      { id: 'чек_идет', title: 'Идет проверка' },
      { id: 'чек_ошибки', title: 'Найдены ошибки' },
      { id: 'чек_часть', title: 'Часть исправлена' },
      { id: 'чек_свернут', title: 'Журнал свернут' },
      { id: 'чек_ок', title: 'Ошибок нет' } ] },
    { group: 'Эквайринг', items: [ { id: 'оплаты', title: 'Оплаты (фон)' } ] },
  ],
  links: [
    { title: 'Прод: Эквайринг → Оплаты', href: 'https://bu.sabyd.ru/page/acquiring-main-payments' },
    { title: 'Демо главной Эквайринга', href: 'https://peabueva.github.io/acquiring/' },
  ],
  value: { scenario: 'отчет_договоры' },
  onChange({ scenario, variant }) { render(variant || scenario); },
});
render('отчет_договоры');
</script>
</body>
</html>
